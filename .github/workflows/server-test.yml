name: Server smoke test (sour-candy-apple)

on:
  push:
    paths:
      - 'sour-candy-apple/**'
      - '.github/workflows/server-test.yml'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Start a dedicated server with the mod and check it loads
        working-directory: sour-candy-apple
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=12345\n" > run/server.properties
          (gradle runServer --no-daemon > server.log 2>&1) &
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then echo "SERVER STARTED OK"; break; fi
            if grep -qiE "Failed to load datapacks|Errors in currently selected|Exception in server tick|crash report" server.log; then echo "SERVER FAILED"; break; fi
            if ! pgrep -f runServer >/dev/null && [ $i -gt 10 ]; then echo "SERVER EXITED"; break; fi
            sleep 5
          done
          echo "----- errors / warnings -----"
          grep -nE "ERROR|WARN|Exception|Caused by|sourcandyapple|loot" server.log | head -80 || true
          echo "----- tail -----"
          tail -40 server.log
          pkill -f runServer || true
          grep -q "Done (" server.log
