name: Recon tab
on:
  push:
    branches: [recon-tab]
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - run: cd dappled-forest-plus && gradle build --no-daemon -q
      - name: Dump
        run: bash .github/recon2.sh > out.txt 2>&1 || true
      - name: Save
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p recon-out && mv out.txt recon-out/ && git add recon-out && git commit -m "out [skip ci]" && git push
