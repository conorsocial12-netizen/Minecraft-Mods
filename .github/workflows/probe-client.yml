name: Probe client
on:
  push:
    branches: [probe-client]
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers >/dev/null
      - name: Run client gametest
        working-directory: 3d-skin-layers
        run: |
          xvfb-run -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon > gt.log 2>&1 || true
          grep -nE "voxelskins|Mixin|ERROR|Exception|Caused by|FAIL|screenshot|Screenshot" gt.log | cut -c1-300 | head -80
          tail -30 gt.log | cut -c1-300
          mkdir -p /tmp/shots; find . -name '*.png' -path '*screenshot*' -exec cp {} /tmp/shots/ \; ; ls -la /tmp/shots
      - name: Push shots
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -q --orphan probe-shots; git rm -rqf . ; git clean -fdxq
          cp /tmp/shots/*.png . ; git add *.png; git commit -qm shots; git push -qf origin probe-shots
