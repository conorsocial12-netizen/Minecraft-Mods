name: Probe
on:
  push:
    branches: [probe-skin-layers]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - name: Probe
        run: |
          cd skin-glow && gradle compileJava --no-daemon -q || true
          cd ..
          CP=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.3/minecraft-merged-deobf-26.3.jar
          jp() { javap -p -cp "$CP" "$@" | grep -v 'lambda\$'; }
          jc() { javap -c -p -cp "$CP" "$1" | awk -v m="$2" 'index($0,m)&&/\(/{f=1} f&&/^$/{f=0} f' | grep -E 'Method|Field|invoke|getfield|putfield|getstatic|new |ifeq|ifne|ldc' | cut -c1-230; }
          echo "#### Ordered"; jp net.minecraft.client.renderer.OrderedSubmitNodeCollector
          echo "#### PlayerModelType"; jp net.minecraft.world.entity.player.PlayerModelType
          echo "#### SkinTextureDownloader"; jp net.minecraft.client.renderer.texture.SkinTextureDownloader
          javap -c -p -cp "$CP" net.minecraft.client.renderer.texture.SkinTextureDownloader | grep -E 'Texture|register' | cut -c1-220 | tail -30
          echo "#### PlayerModel.setupAnim"; jc net.minecraft.client.model.player.PlayerModel 'void setupAnim(net.minecraft.client.renderer.entity.state.AvatarRenderState)'
          echo "#### PlayerModel.<init>"; jc net.minecraft.client.model.player.PlayerModel 'PlayerModel(net'
          echo "#### LER.submit"; jc net.minecraft.client.renderer.entity.LivingEntityRenderer 'public void submit(S'
          echo "#### renderHand"; jc net.minecraft.client.renderer.entity.player.AvatarRenderer 'private void renderHand'
          echo "#### extract"; jc net.minecraft.client.renderer.entity.player.AvatarRenderer 'public void extractRenderState(AvatarlikeEntity'
          echo "#### ResourceManager"; jp net.minecraft.server.packs.resources.ResourceProvider; jp net.minecraft.server.packs.resources.Resource | head -20
          echo "#### Minecraft getters"; jp net.minecraft.client.Minecraft | grep -E 'getTextureManager|getResourceManager|getInstance|options|player;|level;|execute|isSameThread'
          echo "#### DefaultPlayerSkin"; jp net.minecraft.client.resources.DefaultPlayerSkin
          echo "#### Identifier"; jp net.minecraft.resources.Identifier | grep -E 'public static|getPath|getNamespace'
