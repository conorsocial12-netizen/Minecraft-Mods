name: Recon
on:
  push:
    branches: [recon]
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - run: cd poplar-arrow && gradle build --no-daemon -q
      - name: Dump
        run: bash .github/recon.sh > recon.txt 2>&1 || true
      - name: Save output to repo
        run: |
          git config user.name "recon-bot"; git config user.email "recon@users.noreply.github.com"
          mkdir -p recon-out && mv recon.txt recon-out/
          git add recon-out && git commit -m "recon output [skip ci]" && git push
