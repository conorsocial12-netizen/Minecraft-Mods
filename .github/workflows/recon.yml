name: Recon
on:
  push:
    branches: [recon]
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - name: Prepare server run dir
        run: |
          cd poplar-arrow && mkdir -p run/world/datapacks/test/data/test/function run/world/datapacks/test/data/minecraft/tags/function
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=1\nspawn-protection=0\n" > run/server.properties
          echo '{"pack":{"description":"test","pack_format":200,"supported_formats":[1,999],"min_format":1,"max_format":999}}' > run/world/datapacks/test/pack.mcmeta
          echo '{"values":["test:load"]}' > run/world/datapacks/test/data/minecraft/tags/function/load.json
          cat > run/world/datapacks/test/data/test/function/load.mcfunction <<'MC'
          say TEST-START
          forceload add -16 -16 16 16
          schedule function test:run 100t
          MC
          cat > run/world/datapacks/test/data/test/function/run.mcfunction <<'MC'
          say RUN-START
          execute positioned 0 0 0 positioned over motion_blocking run summon poplararrow:dappled_skeleton ~ ~1 ~
          execute positioned 6 0 0 positioned over motion_blocking run summon minecraft:iron_golem ~ ~1 ~ {NoAI:1b,Tags:["v"]}
          execute positioned 0 0 0 positioned over motion_blocking run time set midnight
          execute if entity @e[type=poplararrow:dappled_skeleton] run say SKELETON-EXISTS
          execute if entity @e[type=poplararrow:poplar_arrow] run say ARROW-EXISTS
          execute if items entity @e[type=poplararrow:dappled_skeleton,limit=1] weapon.mainhand minecraft:bow run say HAS-BOW
          execute positioned 0 0 0 positioned over motion_blocking run loot spawn ~ ~2 ~ loot poplararrow:entities/dappled_skeleton
          execute if entity @e[type=item,nbt={Item:{id:"poplararrow:poplar_arrow"}}] run say LOOT-ARROW
          execute if entity @e[type=item,nbt={Item:{id:"minecraft:bone"}}] run say LOOT-BONE
          time set midnight
          schedule function test:check 300t
          MC
          cat > run/world/datapacks/test/data/test/function/check.mcfunction <<'MC'
          execute if entity @e[type=poplararrow:poplar_arrow] run say ARROWS-FLYING-OR-STUCK
          execute as @e[type=iron_golem,tag=v] if data entity @s active_effects run say GOLEM-HAS-EFFECTS
          execute as @e[type=iron_golem,tag=v] run say GOLEM-ALIVE
          execute unless entity @e[type=iron_golem,tag=v] run say GOLEM-DEAD
          execute as @e[type=iron_golem,tag=v] run data get entity @s active_effects
          execute as @e[type=iron_golem,tag=v] run data get entity @s Health
          execute as @e[type=iron_golem,tag=v] if data entity @s active_effects[{id:"poplararrow:leaf_blind"}] run say GOLEM-HAS-LEAF-BLIND
          execute if entity @e[type=poplararrow:poplar_arrow] run say POPLAR-ARROWS-PRESENT
          execute if entity @e[type=minecraft:arrow] run say PLAIN-ARROWS-PRESENT
          say CHECK-DONE
          MC
          sed -i 's/^          //' run/world/datapacks/test/data/test/function/load.mcfunction
      - name: Run server
        run: |
          cd poplar-arrow
          timeout 200 gradle runServer --no-daemon --args="nogui" > ../server.log 2>&1 || true
      - name: Save output to repo
        if: always()
        run: |
          git config user.name "recon-bot"; git config user.email "recon@users.noreply.github.com"
          mkdir -p recon-out && grep -v "^\s*at \|Download\|%" server.log | tail -400 > recon-out/server.log || true
          git add recon-out && git commit -m "server output [skip ci]" && git push
