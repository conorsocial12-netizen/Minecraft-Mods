name: Vivid screenshots
# Runs the real game with Vivid and saves ON vs OFF screenshots to the vivid-shots-out branch.
on:
  push:
    branches: [vivid-shots]
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers >/dev/null
      - name: Check mixin targets against the real game jar
        working-directory: minecraft-but-better/vivid
        run: |
          gradle compileJava --no-daemon -q > /dev/null 2>&1 || true
          JAR=$(ls ~/.gradle/caches/fabric-loom/26.3/*.jar | tr '\n' ':')
          echo "JAR=$JAR"
          for c in net.minecraft.client.renderer.CloudRenderer net.minecraft.client.renderer.SkyRenderer net.minecraft.client.renderer.fog.FogRenderer \
                   net.minecraft.client.renderer.PostPass net.minecraft.client.renderer.GameRenderer net.minecraft.client.renderer.BiomeColors \
                   net.minecraft.client.renderer.LightmapRenderStateExtractor net.minecraft.client.gui.Hud net.minecraft.world.entity.LivingEntity \
                   net.minecraft.client.player.LocalPlayer net.minecraft.client.multiplayer.MultiPlayerGameMode \
                   net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer net.minecraft.client.renderer.entity.player.AvatarRenderer \
                   net.minecraft.client.model.player.PlayerModel; do
            echo "=== $c"
            javap -p -cp "$JAR" $c | grep -E "prepare|extractRenderState|setupFog|addToFrame| close\(|update\(|getAverageWaterColor| extract\(|extractItemHotbar|handleDamageEvent|handleEntityEvent| crit\(|magicCrit|attack\(|renderLayers|setupAnim|customUniforms|requestedPostEffects| name;| minecraft;|equipmentAssets" || true
          done
      - name: Run client gametest
        working-directory: minecraft-but-better/vivid
        run: |
          xvfb-run -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon > gt.log 2>&1 || true
          grep -nE "vivid|Mixin|ERROR|Exception|Caused by|FAIL|creenshot" gt.log | cut -c1-300 | head -100
          tail -30 gt.log | cut -c1-300
          mkdir -p /tmp/shots; find . -name '*.png' -path '*screenshot*' -exec cp {} /tmp/shots/ \; ; ls -la /tmp/shots
      - name: Push shots
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -q --orphan vivid-shots-out; git rm -rqf . ; git clean -fdxq
          cp /tmp/shots/*.png . ; git add *.png; git commit -qm shots; git push -qf origin vivid-shots-out
